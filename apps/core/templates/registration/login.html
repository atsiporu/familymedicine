{% extends "base.html" %}
{% block title %}Sign in · Practice Portal{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if form.errors %}<p class="error">Username or password is incorrect.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Username <input type="text" name="username" autocomplete="username" autofocus required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
